<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Ser</title>
  </head>
  <body>
    <div id="app">
      <div class="ui">
        <p class="eyebrow">Audio-reactive lifeform</p>
        <h1>El Ser</h1>
        <p class="description">
          Alimenta una criatura visual con música desde una pestaña, el micrófono o un archivo.
        </p>

        <div class="controls">
          <label class="control-label" for="audio-upload">Archivo de audio</label>
          <input id="audio-upload" type="file" accept="audio/*" />
          <span id="file-name" class="file-name">Ninguna pista seleccionada</span>

          <div class="transport">
            <button id="play-button" disabled>Reproducir</button>
            <span id="current-time" class="time-label">0:00</span>
            <input
              id="seek-slider"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              disabled
            />
            <span id="duration" class="time-label">0:00</span>
          </div>

          <div class="volume-control">
            <label class="control-label" for="volume-slider">Volumen</label>
            <input
              id="volume-slider"
              type="range"
              min="0"
              max="100"
              value="80"
            />
          </div>
        </div>

        <div class="meters">
          <div>
            <span>Bass</span>
            <div class="meter"><div id="bass-meter"></div></div>
          </div>
          <div>
            <span>Mids</span>
            <div class="meter"><div id="mids-meter"></div></div>
          </div>
          <div>
            <span>Highs</span>
            <div class="meter"><div id="highs-meter"></div></div>
          </div>
        </div>
      </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
